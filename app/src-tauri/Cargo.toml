[package]
name = "capshot"
description = "Fast, minimal screen capture and recording for Windows 11."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "capshot_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
capshot-core.workspace = true
capshot-encode.workspace = true
capshot-overlay.workspace = true
capshot-record.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-updater.workspace = true
tracing.workspace = true
rqrr.workspace = true
windows = { workspace = true, features = [
    "Win32_UI_WindowsAndMessaging",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_System_WinRT",
    "Win32_Media_Audio",
    "Win32_System_Registry",
] }

[features]
# Serve the web UI embedded in the executable. `tauri dev` builds with
# --no-default-features to load it from the Vite dev server instead; without
# this, a plain `cargo build --release` would also expect the dev server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
