[package]
name = "capshot-gif"
description = "Streaming GIF encoder for Capshot: frame differencing and parallel palette quantisation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
gif = { version = "0.14.2", default-features = false, features = ["std"] }
# Frames are quantised in parallel by our own workers: no inner thread pool.
imagequant = { version = "4.4.1", default-features = false }
capshot-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
