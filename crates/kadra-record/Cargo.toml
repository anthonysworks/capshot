[package]
name = "kadra-record"
description = "Screen recording for Kadra: GPU capture, hardware encoding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
kadra-capture.workspace = true
kadra-core.workspace = true
kadra-gif.workspace = true
thiserror.workspace = true
tracing.workspace = true
windows = { workspace = true, features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
] }

[dev-dependencies]
windows = { workspace = true, features = ["Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_Variant", "Win32_System_Com_StructuredStorage"] }

[lints]
workspace = true
